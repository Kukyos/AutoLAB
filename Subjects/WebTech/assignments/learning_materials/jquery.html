<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>jQuery Playground</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 30px auto; padding: 20px; }
    .box { padding: 12px; margin: 8px 0; border: 1px solid #aaa; }
    .highlight { background: yellow; font-weight: bold; }
  </style>
</head>
<body>
<h1>jQuery 1-2 Mark Playground</h1>

<h2>.val() and .text()</h2>
<input id="name" value="Armaan">
<button id="read">Read input</button>
<div id="result" class="box">Result appears here</div>

<h2>.hide(), .show(), .toggle()</h2>
<div id="notice" class="box">This is the notice.</div>
<button id="hide">Hide</button>
<button id="show">Show</button>
<button id="toggle">Toggle</button>

<h2>.addClass()</h2>
<ul>
  <li>HTML</li>
  <li>CSS</li>
  <li>JavaScript</li>
</ul>
<button id="highlight">Highlight all li</button>

<h2>.click()</h2>
<button id="clickMe">Click me</button>
<p id="clickResult"></p>

<h2>jQuery calculator pattern</h2>
<input id="weight" type="number" placeholder="Weight kg">
<input id="duration" type="number" placeholder="Duration min">
<button id="calculate">Calculate calories</button>
<p id="calorieResult"></p>

<script>
$("#read").click(function() {
  let name = $("#name").val();
  $("#result").text("You entered: " + name);
});

$("#hide").click(function() {
  $("#notice").hide();
});

$("#show").click(function() {
  $("#notice").show();
});

$("#toggle").click(function() {
  $("#notice").toggle();
});

$("#highlight").click(function() {
  $("li").addClass("highlight");
});

$("#clickMe").click(function() {
  $("#clickResult").text("The button was clicked!");
});

$("#calculate").click(function() {
  let weight = Number($("#weight").val());
  let duration = Number($("#duration").val());
  let calories = weight * duration * 0.1;
  let intensity;

  if (calories < 150) {
    intensity = "Low Intensity";
  } else if (calories <= 300) {
    intensity = "Moderate Intensity";
  } else {
    intensity = "High Intensity";
  }

  $("#calorieResult").text(
    "Calories: " + calories + " | " + intensity
  );
});
</script>
</body>
</html>
