<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bootstrap Playground</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

<h1>Bootstrap 1-2 Mark Playground</h1>

<div class="alert alert-warning">
  This is a <strong>warning</strong> alert: <code>alert alert-warning</code>
</div>

<div class="alert alert-success">
  This is a success alert.
</div>

<div class="alert alert-danger">
  This is a danger alert.
</div>

<button class="btn btn-primary">Primary</button>
<button class="btn btn-success">Success</button>
<button class="btn btn-danger">Danger</button>
<button class="btn btn-warning">Warning</button>

<hr>

<p>Remember:</p>
<ul>
  <li>Warning alert → <code>alert alert-warning</code></li>
  <li>Primary button → <code>btn btn-primary</code></li>
</ul>

</body>
</html>
