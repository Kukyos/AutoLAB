<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>BMI Calculator</title>
	<style>
		:root {
			color-scheme: light;
			--black: #111111;
			--gray: #666666;
			--line: #d9d9d9;
			--paper: #f5f5f5;
			--white: #ffffff;
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 24px;
			background: var(--paper);
			color: var(--black);
			font-family: Georgia, 'Times New Roman', serif;
		}

		main {
			width: min(100%, 440px);
			padding: 36px;
			border: 1px solid var(--black);
			background: var(--white);
			box-shadow: 8px 8px 0 var(--black);
		}

		.eyebrow {
			margin: 0 0 10px;
			color: var(--gray);
			font-family: Arial, sans-serif;
			font-size: 0.72rem;
			font-weight: 700;
			letter-spacing: 0.14em;
			text-transform: uppercase;
		}

		h1 {
			margin: 0;
			font-size: clamp(2.2rem, 8vw, 3.4rem);
			line-height: 0.95;
		}

		.intro {
			margin: 18px 0 28px;
			color: var(--gray);
			font-size: 1rem;
			line-height: 1.5;
		}

		form {
			display: grid;
			gap: 18px;
		}

		label {
			display: grid;
			gap: 7px;
			font-family: Arial, sans-serif;
			font-size: 0.84rem;
			font-weight: 700;
		}

		input {
			width: 100%;
			padding: 13px 14px;
			border: 1px solid var(--black);
			border-radius: 0;
			color: var(--black);
			background: var(--white);
			font: 1rem Georgia, 'Times New Roman', serif;
		}

		input:focus {
			outline: 3px solid #bcbcbc;
			outline-offset: 2px;
		}

		button {
			padding: 14px 18px;
			border: 1px solid var(--black);
			border-radius: 0;
			background: var(--black);
			color: var(--white);
			cursor: pointer;
			font: 700 0.84rem Arial, sans-serif;
			letter-spacing: 0.08em;
			text-transform: uppercase;
		}

		button:hover,
		button:focus-visible {
			background: var(--white);
			color: var(--black);
		}

		.result {
			min-height: 116px;
			margin-top: 28px;
			padding: 18px;
			border-top: 1px solid var(--black);
			background: var(--paper);
		}

		.result-label {
			margin: 0 0 4px;
			color: var(--gray);
			font-family: Arial, sans-serif;
			font-size: 0.75rem;
			font-weight: 700;
			letter-spacing: 0.1em;
			text-transform: uppercase;
		}

		#bmi-value {
			margin: 0;
			font-size: 2.4rem;
			line-height: 1;
		}

		#bmi-category {
			margin: 8px 0 0;
			font-family: Arial, sans-serif;
			font-size: 0.9rem;
		}

		.error {
			color: #a00000;
		}

		@media (max-width: 480px) {
			main {
				padding: 28px 22px;
				box-shadow: 5px 5px 0 var(--black);
			}
		}
	</style>
</head>
<body>
	<main>
		<p class="eyebrow">Health / Measurement</p>
		<h1>BMI Calculator</h1>
		<p class="intro">Enter your weight and height to calculate your body mass index.</p>

		<form id="bmi-form">
			<label for="weight">Weight (kg)
				<input id="weight" name="weight" type="number" min="1" step="0.1" placeholder="e.g. 70" required>
			</label>

			<label for="height">Height (cm)
				<input id="height" name="height" type="number" min="1" step="0.1" placeholder="e.g. 175" required>
			</label>

			<button type="submit">Calculate BMI</button>
		</form>

		<section class="result" aria-live="polite">
			<p class="result-label">Your result</p>
			<p id="bmi-value">--</p>
			<p id="bmi-category">Enter your details above.</p>
		</section>
	</main>

	<script>
		const form = document.querySelector('#bmi-form');
		const bmiValue = document.querySelector('#bmi-value');
		const bmiCategory = document.querySelector('#bmi-category');

		form.addEventListener('submit', (event) => {
			event.preventDefault();

			const weight = Number(document.querySelector('#weight').value);
			const heightInMeters = Number(document.querySelector('#height').value) / 100;

			if (weight <= 0 || heightInMeters <= 0 || !Number.isFinite(weight) || !Number.isFinite(heightInMeters)) {
				bmiValue.textContent = 'Error';
				bmiCategory.textContent = 'Please enter positive numbers for both fields.';
				bmiCategory.classList.add('error');
				return;
			}

			const bmi = weight / (heightInMeters * heightInMeters);
			let category = 'Underweight';

			if (bmi >= 30) {
				category = 'Obesity';
			} else if (bmi >= 25) {
				category = 'Overweight';
			} else if (bmi >= 18.5) {
				category = 'Healthy weight';
			}

			bmiValue.textContent = bmi.toFixed(1);
			bmiCategory.textContent = category;
			bmiCategory.classList.remove('error');
		});
	</script>
</body>
</html>
