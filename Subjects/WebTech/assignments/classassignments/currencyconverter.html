<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Currency Converter</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
	<div class="container py-5">
		<div class="row justify-content-center">
			<div class="col-md-6">
				<div class="card shadow-sm">
					<div class="card-body">
						<h1 class="h3 text-center mb-4">Currency Converter</h1>

						<label for="amount" class="form-label">Amount</label>
						<input type="number" id="amount" class="form-control mb-3" placeholder="Enter amount">

						<div class="row g-3">
							<div class="col-6">
								<label for="fromCurrency" class="form-label">From</label>
								<select id="fromCurrency" class="form-select">
									<option value="USD">USD</option>
									<option value="EUR">EUR</option>
									<option value="INR">INR</option>
									<option value="GBP">GBP</option>
								</select>
							</div>
							<div class="col-6">
								<label for="toCurrency" class="form-label">To</label>
								<select id="toCurrency" class="form-select">
									<option value="INR">INR</option>
									<option value="USD">USD</option>
									<option value="EUR">EUR</option>
									<option value="GBP">GBP</option>
								</select>
							</div>
						</div>

						<button id="convertButton" class="btn btn-primary w-100 mt-4">Convert</button>
						<p id="result" class="text-center fs-5 fw-semibold mt-4 mb-0"></p>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/currency.js@2.0.4/dist/currency.min.js"></script>
	<script>
		const rates = {
			USD: 1,
			EUR: 0.92,
			INR: 83.10,
			GBP: 0.79
		};

		document.getElementById("convertButton").addEventListener("click", function () {
			const amount = Number(document.getElementById("amount").value);
			const fromCurrency = document.getElementById("fromCurrency").value;
			const toCurrency = document.getElementById("toCurrency").value;
			const result = document.getElementById("result");

			if (amount <= 0 || isNaN(amount)) {
				result.textContent = "Please enter a valid amount";
				return;
			}

			const convertedAmount = currency(amount)
				.divide(rates[fromCurrency])
				.multiply(rates[toCurrency]);

			result.textContent = `${convertedAmount.format()} ${toCurrency}`;
		});
	</script>
</body>
</html>
