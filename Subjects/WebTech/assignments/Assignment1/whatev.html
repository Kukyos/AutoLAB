<!DOCTYPE html>
<html>
<body>

<h2 id="title">Welcome</h2>

<p class="message">Hello</p>
<p class="message">DOM is fun</p>

<input id="nameInput" type="text" placeholder="Enter your name">

<button onclick="changePage()">Click Me</button>

<div id="output"></div>

<script>
function changePage() {

    // 1. getElementById()
    let title = document.getElementById("title");
    title.innerHTML = "Hello, Armaan!";

    // 2. querySelector()
    let firstMessage = document.querySelector(".message");
    firstMessage.innerHTML = "First message changed!";

    // 3. querySelectorAll()
    let messages = document.querySelectorAll(".message");
    messages.forEach(function(msg) {
        msg.style.fontWeight = "bold";
    });

    // 4. value
    let name = document.getElementById("nameInput").value;

    // 5. innerHTML
    document.getElementById("output").innerHTML =
        "You entered: " + name;

    let newElement = document.createElement("p");
    newElement.innerHTML = "Created element";
    document.getElementById("output").appendChild(newElement);
    let replacement = document.createElement("p");
    replacement.innerHTML = "Replaced element";
    document.getElementById("output").replaceChild(replacement, newElement);
    document.getElementById("output").removeChild(replacement);
    let writeWindow = window.open("", "_blank");
    writeWindow.document.write("<p>document.write() works!</p>");
}
</script>

</body>
</html>
